<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CID OS — Detective Files</title>

    <!--
        Load order:
        1. CSS variables  — design tokens, must be first
        2. global.css     — reset and body baseline
        3. theme.css      — documents ThemeManager's runtime injection contract

        Boot and desktop stylesheets are injected at runtime by their
        respective managers so they are only loaded when needed.
    -->

    <!-- Design tokens -->
    <link rel="stylesheet" href="css/variables/colors.css" />
    <link rel="stylesheet" href="css/variables/typography.css" />
    <link rel="stylesheet" href="css/variables/spacing.css" />
    <link rel="stylesheet" href="css/variables/animation.css" />

    <!-- Base reset and body rules -->
    <link rel="stylesheet" href="css/global.css" />

    <!-- Theme contract documentation (no static rules) -->
    <link rel="stylesheet" href="css/theme/theme.css" />
</head>
<body>

    <!--
        CID OS — Workstation Root
        The boot screen and desktop are mounted here at runtime.
        Do not add UI elements directly to this file.
    -->
    <div id="workstation-root"></div>

    <!-- Bootstrap: ES6 module entry point -->
    <script type="module" src="core/Workstation.js"></script>

</body>
</html>
